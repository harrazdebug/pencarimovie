# PencariMovie Server - Rust/grammers port.
#
#   docker compose -f server/docker-compose.yml up -d --build
#   docker compose -f server/docker-compose.yml logs -f
#
# Context is the repository root (the dashboard is compiled into the binary).
services:
  pm-rust:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: pencarimovie-rust:local
    container_name: pm-rust
    restart: unless-stopped
    ports:
      # host:container - change only the host side if 8092 is taken
      - "8092:8092"
    environment:
      # PaaS-style overrides; every one of these is optional.
      PORT: "8092"
      PM_LISTEN_HOST: "0.0.0.0"
      PM_PAAS: "1"
      PM_APP_ROOT: "/app"
      # PM_WORKERS: "4"        # one Telegram connection per worker
      # PM_INFLIGHT: "8"       # upload.getFile parts in flight per connection
      # PM_MAX_STREAMS: "256"  # concurrent /api/download bodies
    volumes:
      # sessions, auth.json, caches - MUST persist across image upgrades
      - pm-rust-storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8092/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pm-rust-storage:
